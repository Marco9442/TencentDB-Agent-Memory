name: Build and publish Memory Core and Hub images

on:
  push:
    branches:
      - feature/openai-responses
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  memory-core:
    name: Build and publish MemoryCore image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/marco9442/memory-core
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./MemoryCore
          file: ./MemoryCore/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=memory-core
          cache-to: type=gha,mode=max,scope=memory-core

  memory-hub:
    name: Build and publish Memory Hub image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare combined Panel and Knowledge context
        env:
          HUB_CONTEXT: ${{ runner.temp }}/memory-hub-build
        run: |
          PREPARE_ONLY=1 KEEP_CTX=1 CTX_DIR="$HUB_CONTEXT" \
            bash deploy/panel-knowledge-combined/build.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/marco9442/memory-hub
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/memory-hub-build
          file: ${{ runner.temp }}/memory-hub-build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=memory-hub
          cache-to: type=gha,mode=max,scope=memory-hub
